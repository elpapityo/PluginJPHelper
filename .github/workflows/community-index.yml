name: Community Dictionary Index

on:
  push:
    branches: [ main ]
    paths:
      - 'Dictionaries/Community/*.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update community-index.json when changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          rebuild_index() {
          python3 - <<'PY'
          import csv, json, os, pathlib, subprocess, urllib.parse, urllib.request

          root = pathlib.Path('Dictionaries/Community')
          index_path = root / 'community-index.json'
          expected = ['Plugin','Menu','Section','Type','English','Japanese']

          try:
              index = json.loads(index_path.read_text(encoding='utf-8-sig'))
          except FileNotFoundError:
              index = {'version': 1, 'entries': []}

          existing = index['entries']
          if not isinstance(existing, list):
              raise ValueError('Invalid entries in community-index.json')
          entries = {entry['fileName']: entry for entry in existing}
          if len(entries) != len(existing):
              raise ValueError('Duplicate file names in community-index.json')

          token = os.environ.get('GH_TOKEN','')
          repo = os.environ.get('GH_REPOSITORY','')

          def git(*args):
              return subprocess.check_output(['git', '--literal-pathspecs', *args], text=True).strip()

          def owner_for(added_commit):
              try:
                  if added_commit:
                      req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/commits/{added_commit}',
                          headers={'Authorization': f'Bearer {token}', 'Accept':'application/vnd.github+json'}
                      )
                      with urllib.request.urlopen(req, timeout=20) as r:
                          obj = json.load(r)
                      login = ((obj.get('author') or {}).get('login') or '').strip()
                      if login:
                          return login
              except Exception:
                  pass
              return os.environ.get('GITHUB_ACTOR','unknown') or 'unknown'

          changed = False
          for path in sorted(root.glob('*.csv'), key=lambda p: p.name.casefold()):
              entry = entries.get(path.name)
              blob_sha = git('rev-parse', f'HEAD:{path.as_posix()}')
              if entry is not None and entry.get('sha') == blob_sha:
                  continue

              last_subject = git('log', '-1', '--format=%s', '--', str(path))
              added_commit = ''
              added_subject = ''
              if entry is None:
                  added_commit, _, added_subject = git(
                      'log', '-1', '--no-renames', '--diff-filter=A',
                      '--format=%H%x09%s', '--', str(path)
                  ).partition('\t')

              web_upload = f'Community dictionary upload: {path.name} by '
              if last_subject.startswith(web_upload) or added_subject.startswith(web_upload):
                  print(f'Waiting for Web upload to update the index: {path.name}')
                  continue

              try:
                  with path.open('r', encoding='utf-8-sig', newline='') as f:
                      reader = csv.reader(f)
                      header = next(reader, None)
                      if header != expected:
                          print(f'Skipping CSV with an invalid header: {path.name}')
                          continue
                      plugin = ''
                      for row in reader:
                          if len(row) >= 1 and row[0].strip():
                              plugin = row[0].strip()
                              break
                      if not plugin:
                          plugin = path.stem
              except (OSError, UnicodeError, csv.Error):
                  print(f'Skipping unreadable CSV: {path.name}')
                  continue

              if entry is None:
                  entry = {'fileName': path.name, 'owner': owner_for(added_commit)}
                  entries[path.name] = entry
              entry.update({
                  'pluginName': plugin,
                  'updated': git('log', '-1', '--format=%as', '--', str(path)),
                  'sha': blob_sha,
                  'downloadUrl': f'https://raw.githubusercontent.com/{repo}/main/Dictionaries/Community/{urllib.parse.quote(path.name)}',
              })
              changed = True

          for file_name in list(entries):
              path = root / file_name
              if path.exists():
                  continue
              last_subject = git('log', '-1', '--format=%s', '--', str(path))
              if last_subject == f'Delete community dictionary: {file_name}':
                  print(f'Waiting for Web deletion to update the index: {file_name}')
                  continue
              del entries[file_name]
              changed = True

          if changed:
              index['entries'] = list(entries.values())
              index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          }

          index_path=Dictionaries/Community/community-index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            base=$(git rev-parse HEAD)
            rebuild_index
            if [[ -z $(git status --porcelain -- "$index_path") ]]; then
              echo "No changes to community-index.json."
              exit 0
            fi
            git add -- "$index_path"
            git commit -m "Update community dictionary index" -- "$index_path"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi

            git fetch --no-tags origin refs/heads/main
            if [[ $(git rev-parse FETCH_HEAD) == "$base" || $attempt == 3 ]]; then
              exit 1
            fi
            echo "main advanced. Rebuilding the index from its latest commit."
            git checkout --detach FETCH_HEAD
          done
