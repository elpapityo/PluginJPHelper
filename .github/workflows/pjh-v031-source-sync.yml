name: PJH v0.3.1 source sync

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/pjh-v031-source-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Artisan v0.3.1 core fixes
        run: python3 .github/scripts/pjh_v031_patch.py
      - name: Verify source
        run: |
          grep -q 'private static bool TryTranslateArtisanDynamic' PluginJPHelper/Plugin.cs
          grep -q 'Retainer Item:' PluginJPHelper/Plugin.cs
          grep -q 'List Editor' PluginJPHelper/Plugin.cs
      - name: Commit source and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .pjh-stage .pjh-stage-v031
          rm -f .github/scripts/pjh_v031_patch.py
          rm -f .github/workflows/pjh-v031-source-sync.yml
          git add -A
          git commit -m "Plugin JP Helper v0.3.1 Artisan translation fixes"
          git push
