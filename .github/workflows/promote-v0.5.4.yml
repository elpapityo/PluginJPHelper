name: Promote Plugin JP Helper v0.5.4

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/promote-v0.5.4.yml"
      - ".github/scripts/promote_v054.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote source
        run: python .github/scripts/promote_v054.py

      - name: Commit source
        run: |
          git config user.name "rioriopu"
          git config user.email "rioriopuu@gmail.com"
          git add -A -- PluginJPHelper VERSION.txt build.bat CHANGELOG.md pluginmaster.json source-patch
          git diff --cached --check
          git commit -m "Release Plugin JP Helper v0.5.4"
          git push origin main
