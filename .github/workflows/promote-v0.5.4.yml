          s = s.replace('const string baseTitle = "Plugin JP Helper v0.5.0";', 'const string baseTitle = "Plugin JP Helper v0.5.4";')
          s = s.replace('PluginJPHelper/0.4.4', 'PluginJPHelper/0.5.4')

