name: Promote Plugin JP Helper v0.5.4

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/promote-v0.5.4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote v0.5.4 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import json, re

          root = Path('.')
          p = root / 'PluginJPHelper' / 'Plugin.cs'
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing source block: {label}')
              s = s.replace(old, new, 1)

          once(
              '    private long communityLastAttemptTick;\n    private const long UpdateCheckIntervalMs = 3_600_000; // 起動時 + 1時間ごとに確認\n',
