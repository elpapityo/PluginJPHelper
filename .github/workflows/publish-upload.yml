name: Publish Plugin JP Helper upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-upload.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select uploaded package
        id: pkg
        shell: bash
        run: |
          ZIP=$(find upload -maxdepth 1 -type f -name 'PluginJPHelper_v*.zip' | sort -V | tail -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No upload ZIP found."
            exit 1
          fi
          FILE=$(basename "$ZIP")
          VERSION=${FILE#PluginJPHelper_v}
          VERSION=${VERSION%.zip}
          TAG="V${VERSION}"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Add v0.4.5 changelog entry
        if: steps.pkg.outputs.version == '0.4.5'
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## v0\.4\.5$' CHANGELOG.md; then
            echo 'CHANGELOG.md already contains v0.4.5.'
            exit 0
          fi
          cat > /tmp/v045.md <<'EOF'
          # CHANGELOG

          ## v0.4.5

          ### 追加・改善

          - Plugin Installerの更新履歴を日本語化する「更新履歴を翻訳」を追加。
          - 更新履歴は未翻訳分を判定し、1回最大50件ずつ新しい順に翻訳。次回は翻訳済みを除外して続きから処理。
          - 更新履歴翻訳中にGoogle翻訳がHTTP 429となった場合、Googleへ再送せずPJH中継サーバーへ1回だけ切り替えるよう改善。
          - Plugin Installerに「コマンド説明を再取得」を追加。Dalamudに登録されているコマンド説明を再取得し、未翻訳分を翻訳待ちへ追加。
          - コマンド説明の区切りとして `:` / `：` / `->` / `→` に対応し、コマンド本体を保持したまま説明文を翻訳。
          - 起動時・差分チェック時には外部翻訳へ送信せず、ユーザー操作時だけ翻訳を実行する仕様を維持。

          EOF
          tail -n +2 CHANGELOG.md >> /tmp/v045.md
          mv /tmp/v045.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Add v0.4.5 changelog"
          git push

      - name: Verify package and version
        shell: bash
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          test -s "$ZIP"
          unzip -l "$ZIP" | grep -q 'PluginJPHelper.dll'
          unzip -l "$ZIP" | grep -q 'PluginJPHelper.json'
          unzip -p "$ZIP" PluginJPHelper.json > /tmp/PluginJPHelper.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/PluginJPHelper.json', encoding='utf-8-sig') as f:
              manifest = json.load(f)
          expected = os.environ['VERSION'] + '.0'
          actual = manifest.get('AssemblyVersion')
          if actual != expected:
              raise SystemExit(f'AssemblyVersion mismatch: ZIP={actual!r}, filename={expected!r}')
          print(f'Verified AssemblyVersion: {actual}')
          PY

      - name: Sync pluginmaster to uploaded version
        shell: bash
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['VERSION']
          path = Path('pluginmaster.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          if not isinstance(data, list) or not data:
              raise SystemExit('pluginmaster.json must contain a non-empty JSON array')
          entry = data[0]
          assembly = f'{version}.0'
          url = f'https://github.com/elpapityo/PluginJPHelper/releases/download/V{version}/PluginJPHelper_v{version}.zip'
          entry['AssemblyVersion'] = assembly
          entry['DownloadLinkInstall'] = url
          entry['DownloadLinkUpdate'] = url
          entry['DownloadLinkTesting'] = url
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Synced pluginmaster.json -> {assembly}')
          PY
          if ! git diff --quiet -- pluginmaster.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pluginmaster.json
            git commit -m "Sync pluginmaster for v${VERSION}"
            git push
          else
            echo "pluginmaster.json already matches v${VERSION}."
          fi

      - name: Create or replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          ZIP="${{ steps.pkg.outputs.zip }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Plugin JP Helper v${VERSION}" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --title "Plugin JP Helper v${VERSION}" --notes-file CHANGELOG.md
          fi
