name: Publish Plugin JP Helper v0.4.7 temp

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v0.4.7-temp.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare changelog and pluginmaster
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = '0.4.7'
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8-sig')
          if '## v0.4.7' not in text:
              section = '''## v0.4.7\n\n### 修正・改善\n\n- Plugin InstallerのRemote Manifestが起動後や再読み込み後に差し替わり、説明文が英語へ戻る場合がある問題を修正。\n- 差分チェックとは別に、現在表示に使われているRemote Manifestへ既存辞書を2秒間隔で再適用するよう変更。外部翻訳への送信は行いません。\n- 同じInternalNameのプラグインが複数リポジトリに存在する場合でも、1件に絞らず表示中のRemote Manifest全件へ翻訳を適用するよう修正。\n- 差分判定・辞書更新は従来どおり代表Manifest 1件を使用し、同名別リポジトリによる重複翻訳やGoogle送信は増やさない仕様を維持。\n- PJHをOFF→ONしなくても、Plugin Installer側の表示更新後に自動で日本語化へ戻るよう改善。\n- 2秒間隔の表示再適用から、差分チェック・Manifestスナップショット保存・外部翻訳キュー処理を完全に分離。重い処理は通常の差分チェック間隔または手動実行時だけ動作するよう修正。\n\n'''
              if text.startswith('# CHANGELOG\n'):
                  text = '# CHANGELOG\n\n' + section + text[len('# CHANGELOG\n\n'):]
              else:
                  text = '# CHANGELOG\n\n' + section + text
              changelog.write_text(text, encoding='utf-8')

          pm = Path('pluginmaster.json')
          data = json.loads(pm.read_text(encoding='utf-8-sig'))
          e = data[0]
          e['Changelog'] = 'v0.4.7: Plugin Installer側でRemote Manifestが後から差し替わる場合でも自動で翻訳を再適用するよう修正。同名プラグインが複数リポジトリに存在する場合も、表示中のRemote Manifest全件へ翻訳を適用します。'
          e['AssemblyVersion'] = '0.4.7.0'
          e['IconUrl'] = 'https://raw.githubusercontent.com/elpapityo/PluginJPHelper/main/images/icon.png?v=0.4.7'
          url = 'https://github.com/elpapityo/PluginJPHelper/releases/download/V0.4.7/PluginJPHelper_v0.4.7.zip'
          e['DownloadLinkInstall'] = url
          e['DownloadLinkUpdate'] = url
          e['DownloadLinkTesting'] = url
          pm.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          if ! git diff --quiet -- CHANGELOG.md pluginmaster.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md pluginmaster.json
            git commit -m "Prepare v0.4.7 release metadata"
            git push
          fi

      - name: Verify uploaded package
        shell: bash
        run: |
          set -euo pipefail
          ZIP='upload/PluginJPHelper_v0.4.7.zip'
          test -s "$ZIP"
          unzip -l "$ZIP" | grep -q 'PluginJPHelper.dll'
          unzip -l "$ZIP" | grep -q 'PluginJPHelper.json'
          unzip -p "$ZIP" PluginJPHelper.json > /tmp/PluginJPHelper.json
          python3 - <<'PY'
          import json
          with open('/tmp/PluginJPHelper.json', encoding='utf-8-sig') as f:
              m = json.load(f)
          if m.get('AssemblyVersion') != '0.4.7.0':
              raise SystemExit(f"AssemblyVersion mismatch: {m.get('AssemblyVersion')!r}")
          print('Verified AssemblyVersion: 0.4.7.0')
          PY

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view V0.4.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload V0.4.7 upload/PluginJPHelper_v0.4.7.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit V0.4.7 --repo "$GITHUB_REPOSITORY" --title 'Plugin JP Helper v0.4.7' --notes-file CHANGELOG.md
          else
            gh release create V0.4.7 upload/PluginJPHelper_v0.4.7.zip --repo "$GITHUB_REPOSITORY" --title 'Plugin JP Helper v0.4.7' --notes-file CHANGELOG.md
          fi
