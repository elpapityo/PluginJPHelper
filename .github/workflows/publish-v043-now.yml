name: Publish Plugin JP Helper v0.4.3 now

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-v043-now.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover tested v0.4.3 package
        shell: bash
        run: |
          set -euo pipefail
          git show 54c102bcf874cb71a2c3c538571876a8dcb29243:upload/PluginJPHelper_v0.4.3.zip > /tmp/PluginJPHelper_v0.4.3.zip
          test -s /tmp/PluginJPHelper_v0.4.3.zip
          unzip -l /tmp/PluginJPHelper_v0.4.3.zip | grep -q 'PluginJPHelper.dll'
          unzip -l /tmp/PluginJPHelper_v0.4.3.zip | grep -q 'PluginJPHelper.json'
          unzip -l /tmp/PluginJPHelper_v0.4.3.zip | grep -q 'images/icon.png'
          unzip -p /tmp/PluginJPHelper_v0.4.3.zip PluginJPHelper.json > /tmp/PluginJPHelper.json
          python3 - <<'PY'
          import json
          with open('/tmp/PluginJPHelper.json', encoding='utf-8-sig') as f:
              manifest = json.load(f)
          actual = manifest.get('AssemblyVersion')
          if actual != '0.4.3.0':
              raise SystemExit(f'AssemblyVersion mismatch: {actual!r}')
          print('Verified AssemblyVersion:', actual)
          PY

      - name: Prepare public icon and pluginmaster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          unzip -p /tmp/PluginJPHelper_v0.4.3.zip images/icon.png > images/icon.png
          test -s images/icon.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('pluginmaster.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))
          entry = data[0]
          version = '0.4.3'
          url = f'https://github.com/elpapityo/PluginJPHelper/releases/download/V{version}/PluginJPHelper_v{version}.zip'
          entry['AssemblyVersion'] = version + '.0'
          entry['DownloadLinkInstall'] = url
          entry['DownloadLinkUpdate'] = url
          entry['DownloadLinkTesting'] = url
          entry['IconUrl'] = f'https://raw.githubusercontent.com/elpapityo/PluginJPHelper/main/images/icon.png?v={version}'
          entry['Changelog'] = 'v0.4.3 未翻訳取得からの自動翻訳支援を追加。確認後に辞書へ反映する方式、翻訳ログ、操作待ち表示、選択プラグイン同期、既存翻訳保護を追加。'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json images/icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Plugin JP Helper v0.4.3 publication"
            git push
          fi

      - name: Create v0.4.3 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## v0.4.3

          ### 主な追加・改善
          - 未翻訳取得した文字列をGoogle翻訳で下書きできる「自動翻訳」を追加。
          - FF14用語・URL・コマンド・ImGui ID・プラグイン名などを可能な範囲で保護。
          - 自動翻訳は結果を確認してから辞書へ反映する方式にし、既存の手修正済み翻訳・公式訳は上書きしないよう保護。
          - 自動翻訳ログを追加し、翻訳・保護・スキップ・失敗の内容を確認可能。
          - 「未翻訳・取得」を「未翻訳取得」「自動翻訳」の2サブタブに整理。
          - その他取得分を「対象候補 / 他プラグイン / 判定不能」に分類。
          - 取得中・翻訳中・確認待ち中は関連操作をロックし、誤操作を防止。
          - `● 操作待ち` の赤⇔白点滅表示を追加。
          - 翻訳辞書側と未翻訳・取得側で、選択中プラグイン名だけを相互に適用できるボタンを追加。
          - ヘルプに、未翻訳取得から自動翻訳・確認・辞書反映・CSV保存までの詳しい使い方を追加。

          ### アイコン
          - Plugin JP Helperのアイコンを新デザインへ変更。
          - 公開アイコンは `images/icon.png` を使用し、IconUrlにバージョンを付けて更新。

          ### 注意
          - 自動翻訳は辞書作成を補助するための下書き機能です。内容を確認・必要に応じて修正してから利用してください。
          EOF
          if gh release view V0.4.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload V0.4.3 /tmp/PluginJPHelper_v0.4.3.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit V0.4.3 --repo "$GITHUB_REPOSITORY" --title "Plugin JP Helper v0.4.3" --notes-file /tmp/release-notes.md
          else
            gh release create V0.4.3 /tmp/PluginJPHelper_v0.4.3.zip --repo "$GITHUB_REPOSITORY" --title "Plugin JP Helper v0.4.3" --notes-file /tmp/release-notes.md
          fi
