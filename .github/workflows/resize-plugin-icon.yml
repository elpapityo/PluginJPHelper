name: Resize Plugin JP Helper Icon

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/resize-plugin-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resize icon to 512x512
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          p = 'assets/PluginJPHelper.png'
          img = Image.open(p).convert('RGBA')
          img = img.resize((512, 512), Image.Resampling.LANCZOS)
          img.save(p, optimize=True)
          print('saved', p, img.size)
          PY
      - name: Commit resized icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/PluginJPHelper.png
          git diff --cached --quiet && exit 0
          git commit -m "Resize Plugin JP Helper icon to 512x512"
          git push
